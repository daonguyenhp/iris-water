# Iris Water — Wastewater Surface Analysis Configuration

roi:
  box: null

thresholds:
  warn_pct: 25.0
  alarm_pct: 40.0
  cooldown_sec: 60

model:
  backend: water_foam
  bundle_path: models/water_foam/water_foam_bundle.pth
  img_size: 256
  water_thresh: 0.5
  foam_thresh: 0.5
  weights_path: models/foam/best.pt
  class_names: [foam]
  conf: 0.35
  imgsz: 640
  device: "cpu"

hsv:
  h_min: 0
  h_max: 180
  s_min: 0
  s_max: 80
  v_min: 160
  v_max: 255

preprocess:
  blur_ksize: 5

morphology:
  open_ksize: 3
  close_ksize: 7
  min_area_px: 80

output:
  save_overlay: true
  overlay_dir: data/foam/overlays

camera_loop:
  interval_sec: 0.5    # ~2 FPS live sampling trên CPU (model ~8.4 FPS / ~119ms -> ~25% CPU duty)
  adaptive: true       # Tự giãn khoảng lấy mẫu nếu CPU bận / latency tăng
  duty_factor: 3.0     # Khoảng nghỉ tối thiểu >= 3x thời gian suy luận thực tế

video_sampling:
  target_fps: 2.0      # Lấy ~2 frame/giây trên CPU (30 frame * ~135ms ≈ 4s cho cả video)
  max_frames: 30       # Chia đều bước nhảy trên toàn bộ video thay vì chỉ lấy đoạn đầu

live_overlay:
  stride_frames: 15    # Chạy AI keyframe mỗi 15 frame (~2 FPS trên video 30 FPS)
  max_shift_px: 18.0   # Giới hạn dịch nhẹ mask tối đa ±18px giữa 2 keyframe

water_analysis:
  illumination_compensation: true
  clarity_clear_threshold: 55.0
  clarity_moderate_threshold: 25.0

sludge_analysis:
  mature_h_min: 10
  mature_h_max: 28
  mature_s_min: 45
  mature_v_min: 45

debris_detection:
  min_area_px: 180
  max_area_ratio: 0.18
  contrast_threshold: 42.0
  warn_count: 1
  alarm_count: 3
